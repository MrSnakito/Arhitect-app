          const bendGeo = new THREE.TorusGeometry(bendR, pipeR, 10, 20, angleRad);
          bendGeo.translate(-bendR, 0, 0);
          bendGeo.rotateZ(-Math.PI/2);
          bendGeo.translate(straightLen, 0, 0);
          group.add(new THREE.Mesh(bendGeo, mat));
          const capX = straightLen + bendR*Math.sin(angleRad);
          const capY = bendR*(1-Math.cos(angleRad));
          const outDir = new THREE.Vector2(Math.cos(angleRad), Math.sin(angleRad));
          const seg2 = new THREE.Mesh(makeTubeGeometry(straightLen, pipeR, wallT), mat);
          seg2.position.set(capX+outDir.x*straightLen/2, capY+outDir.y*straightLen/2, 0);
          seg2.rotation.z = angleRad - Math.PI/2;
          group.add(seg2);
          return addSocketRing(group, pipeR);
        }
        if(el.props.tip.startsWith('Ramificatie')){
          // ramificație REALĂ — tub principal (30cm, gol) cu o ramură curbată (gaură, ca la cot) care pleacă din mijloc
          const r1 = (el.props.diametru1||11)/200, r2 = (el.props.diametru2||6)/200;
          const mainLen = 0.30; // 30cm exemplu — aproximare, ajustăm dacă ai cifre reale
          const wallT1 = Math.max(0.003, r1*0.08), wallT2 = Math.max(0.003, r2*0.08);
          const group = new THREE.Group();
          const mainTube = new THREE.Mesh(makeTubeGeometry(mainLen, r1, wallT1), mat);
          mainTube.rotation.z = -Math.PI/2;
          mainTube.position.set(mainLen/2, 0, 0);
          group.add(mainTube);
          const midX = mainLen*0.25; // prindere mai aproape de capătul A (nu la mijloc) — ramura se deschide spre capătul B
          const bendR = Math.max(0.03, r2*1.5);
          const angleRad = (el.props.unghi||45) * Math.PI/180;
          const capY = bendR*(1-Math.cos(angleRad));
          const yOffset = 0; // am anulat aici mutarea în jos de mai devreme — problema reală era poziția pe lungime, deja reparată mai sus
          const bendGeo = new THREE.TorusGeometry(bendR, r2, 10, 20, angleRad);
          bendGeo.translate(-bendR, 0, 0);
          bendGeo.rotateZ(-Math.PI/2);
          bendGeo.translate(midX, yOffset, 0); // ramura pleacă din mijlocul tubului principal
          group.add(new THREE.Mesh(bendGeo, mat));
          const capX = midX + bendR*Math.sin(angleRad);
          const outDir = new THREE.Vector2(Math.cos(angleRad), Math.sin(angleRad));
          const straightLen2 = 0.15; // +5cm față de standard (0.10), cerut explicit pt tubul de după curbă
          const segBranch = new THREE.Mesh(makeTubeGeometry(straightLen2, r2, wallT2), mat);
          segBranch.position.set(capX+outDir.x*straightLen2/2, yOffset+capY+outDir.y*straightLen2/2, 0);
          segBranch.rotation.z = angleRad - Math.PI/2;
          group.add(segBranch);
          {
            // inel pe tubul principal, la capătul B (celălalt capăt față de unde pleacă ramura)
            const bandWidthM = Math.max(0.012, r1*0.4), bandRM = r1*1.015;
            const ringMatM = new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.6, metalness:0.2, side:THREE.DoubleSide});
            const ringM = new THREE.Mesh(new THREE.CylinderGeometry(bandRM, bandRM, bandWidthM, 20, 1, true), ringMatM);
            ringM.rotation.z = -Math.PI/2;
            ringM.position.set(mainLen - bandWidthM/2, 0, 0);
            group.add(ringM);
          }
          {
            // inel la vârful ramurii (capătul liber, după curbură) — orientat pe direcția ramurii, nu pe axa principală
            const tipX = capX+outDir.x*straightLen2, tipY = yOffset+capY+outDir.y*straightLen2;
            const bandWidthT = Math.max(0.012, r2*0.4), bandRT = r2*1.015;
            const ringMatT = new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.6, metalness:0.2, side:THREE.DoubleSide});
            const ringT = new THREE.Mesh(new THREE.CylinderGeometry(bandRT, bandRT, bandWidthT, 20, 1, true), ringMatT);
            ringT.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(outDir.x, outDir.y, 0));
            ringT.position.set(tipX-outDir.x*bandWidthT/2, tipY-outDir.y*bandWidthT/2, 0);
            group.add(ringT);
          }
          return group;
        }
        let geo;
        if(el.props.tip.startsWith('Reductie')){
          // reducție reală, EXCENTRICĂ — tub drept mare (10cm), tranziție scurtă cu o margine aliniată, tub drept mic (10cm) decalat
          const rTop = (el.props.diametru1||11)/200, rBot = (el.props.diametru2||5)/200;
          const wallT = Math.max(0.003, Math.min(rTop,rBot)*0.12);
          const straightLen = 0.10, taperLen = 0.02;
          const offsetAmount = rTop - rBot; // cu cât se mută axa tubului mic, ca marginea de sus să rămână aliniată
          const group = new THREE.Group();
          const seg1 = new THREE.Mesh(makeTubeGeometry(straightLen, rTop, wallT), mat);
          seg1.rotation.z = -Math.PI/2; seg1.position.set(straightLen/2, 0, 0);
          group.add(seg1);
          const taper = makeEccentricTaperGeometry(taperLen, rTop, rBot, wallT, mat);
          taper.position.set(straightLen, 0, 0);
          group.add(taper);
          const seg2 = new THREE.Mesh(makeTubeGeometry(straightLen, rBot, wallT), mat);
          seg2.rotation.z = -Math.PI/2; seg2.position.set(straightLen+taperLen+straightLen/2, offsetAmount, 0);
          group.add(seg2);
          return addSocketRing(group, rTop);
        }
        if(isPipe){
          const rOut = (el.props.diametru||11)/200;
          geo = makeTubeGeometry(L, rOut, Math.max(0.003, rOut*0.08));
          geo.rotateZ(-Math.PI/2); // tubul e nativ pe Y — îl aducem pe X local, ca restul
        } else {
          let rTop, rBot;
          if(el.props.tip.startsWith('Reductie')){ rTop=(el.props.diametru1||11)/200; rBot=(el.props.diametru2||6)/200; }
          else if(el.props.tip.startsWith('Ramificatie')){ rTop=rBot=(el.props.diametru1||11)/200; }
          else { rTop=rBot=(el.props.diametru||11)/200; }
          geo = new THREE.CylinderGeometry(rTop, rBot, L, 14);
          geo.rotateZ(-Math.PI/2); // cilindrul (implicit pe Y) -> lungimea pe X local, ca restul
        }
        geo.translate(L/2, 0, 0); // era centrat (-L/2..L/2) — îl mut ca intrarea (capătul A) să fie la originea locală, ca la cot
        const ringR = isPipe ? (el.props.diametru||11)/200 : (el.props.diametru||el.props.diametru1||11)/200;
        return addSocketRing(new THREE.Mesh(geo, mat), ringR);
      }

      if(el.props.orientareVerticala){
        const Lv = Math.max(0.05, el.props.lungimeVerticala||1.5);
        mesh = buildLocal(Lv);
        mesh.position.set(el.p1.x, zA, el.p1.y);
        const qSpin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), spinRad);
        const qUp = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0));
        mesh.quaternion.copy(qUp).multiply(qSpin);
      } else {
        const dx = el.p2.x-el.p1.x, dy = el.p2.y-el.p1.y;
        const dz = zB-zA;
        const L3 = Math.max(0.01, Math.sqrt(dx*dx+dy*dy+dz*dz));
        mesh = buildLocal(L3);
        mesh.position.set(el.p1.x, zA, el.p1.y);
        const dir = new THREE.Vector3(dx, dz, dy).normalize(); // lume (x,y,z) = (plan x, elevație, plan y)
        const qSpin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), spinRad);
        const qAlign = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0), dir);
        mesh.quaternion.copy(qAlign).multiply(qSpin);
      }
    } else if(el.type==='cablu' && el.props.tip==='Doza'){
      const zA = (el.props.zA||0)/1000;
      const Lm = (el.props.lungimeDoza||8)/100, Wm = (el.props.latimeDoza||8)/100, Hm = (el.props.inaltimeDoza||4)/100;
      const geo = new THREE.BoxGeometry(Lm, Hm, Wm);
      const matD = new THREE.MeshStandardMaterial({color:0xf2f0ea, roughness:0.6, metalness:0});
      mesh = new THREE.Mesh(geo, matD);
      mesh.position.set(el.p1.x, zA+Hm/2, el.p1.y);
    } else if(el.type==='cablu'){
      const zA = (el.props.zA||0)/1000, zB = (el.props.zB||0)/1000;
      const rFir = (el.props.diametruFir||1.5)/2000; // mm -> m, rază
      const spinRad = (el.props.rotatieProfil||0) * Math.PI/180;
      const culori = [0xe8180a, 0xff2a1a, 0xc21206]; // roșu clar (3 nuanțe, ca să se distingă firele), vizibil pe fundal închis
      function buildCabluLocal(L){
        const group = new THREE.Group();
        const offsets = [-rFir*1.3, rFir*1.3, 0];
        const offsetsZ = [0, 0, rFir*2.2];
        for(let i=0;i<3;i++){
          const m = new THREE.MeshStandardMaterial({color:culori[i], roughness:0.7, metalness:0});
          const wire = new THREE.Mesh(new THREE.CylinderGeometry(rFir, rFir, L, 8), m);
          wire.rotation.z = -Math.PI/2; wire.position.set(L/2, offsets[i], offsetsZ[i]);
          group.add(wire);
        }
        return group;
      }
      if(el.props.orientareVerticala){
        const Lv = Math.max(0.05, el.props.lungimeVerticala||1.5);
        mesh = buildCabluLocal(Lv);

        const qSpin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), spinRad);
        const qUp = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0));
        mesh.quaternion.copy(qUp).multiply(qSpin);
      } else {
        const dx = el.p2.x-el.p1.x, dy = el.p2.y-el.p1.y;
        const dz = zB-zA;
        const L3 = Math.max(0.01, Math.sqrt(dx*dx+dy*dy+dz*dz));
        mesh = buildCabluLocal(L3);
        mesh.position.set(el.p1.x, zA, el.p1.y);
        const dir = new THREE.Vector3(dx, dz, dy).normalize();
        const qSpin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), spinRad);
        const qAlign = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0), dir);
        mesh.quaternion.copy(qAlign).multiply(qSpin);
      }
    }
    if(mesh){
      mesh.userData.isProjectMesh = true;
      mesh.userData.elId = el.id;

      }
      threeScene.add(mesh);
      if(el.id === state.selectedId){
        const outline = new THREE.BoxHelper(mesh, 0x5a83a3);
        outline.userData.isProjectMesh = true;
        threeScene.add(outline);
        if(el.type==='beam'){
          const zA2=(el.props.zA||0)/1000, zB2=(el.props.zB||0)/1000;
          const topA2 = zA2+el.props.inaltimeA/100, topB2 = zB2+el.props.inaltimeB/100;
          const spA = makeEndLabelSprite('A'); spA.position.set(el.p1.x, topA2+0.15, el.p1.y);
          const spB = makeEndLabelSprite('B'); spB.position.set(el.p2.x, topB2+0.15, el.p2.y);
          spA.userData.isProjectMesh = true; spB.userData.isProjectMesh = true;
          threeScene.add(spA); threeScene.add(spB);
        }
      }
    }
  }
  needsRender = true;
}

function resizeThree(){
  if(!threeRenderer) return;
  const r = threeWrap.getBoundingClientRect();
  threeRenderer.setSize(r.width, r.height);
  threeCamera.aspect = r.width/r.height;
  threeCamera.updateProjectionMatrix();
  needsRender = true;
}
window.addEventListener('resize', resizeThree);

/* =========================================================================
   13. UNELTE (bara din stânga) + TASTATURĂ
   ========================================================================= */
document.querySelectorAll('.tool').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.tool = btn.dataset.tool;
    state.drawing = null;
    clearPreview();
    coordTip.style.display = 'none';
    const hints = {
      select:'Click pe un element din model pentru a-i vedea proprietățile.',
      foundation:'Click pentru primul capăt al fundației, click din nou pentru al doilea — linia se fixează automat pe X sau pe Y. Esc anulează.',
      placa:'Click pentru primul colț al plăcii, click din nou pentru al doilea — linia se fixează automat pe X sau pe Y. Esc anulează.',
      post:'Click pe planul de bază pentru a plasa un stâlp — se aliniază automat pe X sau Y cu ultimul stâlp (sau cel selectat). Distanța exactă o tastezi apoi în panou, la „Distanță liberă până la stâlpul vecin".',
      beam:'Click pentru un capăt al grinzii (se prinde automat de stâlpi/grinzi din apropiere), click din nou pentru celălalt capăt.',
      rigips:'Click pentru un capăt al profilului CW, click din nou pentru celălalt. Se fixează automat pe X sau Y.',
      panou:'Click pentru un capăt al plăcii (implicit OSB), click din nou pentru celălalt. Se fixează automat pe X sau Y.',
      membrana:'Click pentru un capăt al învelitorii (implicit membrană bituminoasă), click din nou pentru celălalt. Se fixează automat pe X sau Y.',
      agregat:'Click pentru un capăt al stratului de agregat (implicit piatră spartă), click din nou pentru celălalt. Se fixează automat pe X sau Y.',
      teava:'Click pentru un capăt al țevii de canalizare, click din nou pentru celălalt — la orice unghi (pantă liberă).',
      delete:'Click pe un element din model pentru a-l șterge.'
    };
    hint.textContent = hints[state.tool];
  });
});

window.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ state.drawing=null; clearPreview(); }
  if((e.key==='Delete'||e.key==='Backspace') && state.selectedId && document.activeElement.tagName!=='INPUT'){
    state.elements = state.elements.filter(e=>e.id!==state.selectedId);
    state.selectedId=null; runFullCheck();
  }
});

/* =========================================================================
   14. INIT
   ========================================================================= */
renderSettings();
hint.textContent = 'Se încarcă proiectul din cloud...';

function startAfterFirebase(){
  (async ()=>{
    await load();
    await refreshProjectSelect();
    renderProps();
    updateStatusBar();
    buildThreeScene();
  })();
}
function showApp(){
  if(window.__appStarted) return;
  window.__appStarted = true;
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('app').style.display = '';
  if(!firebaseAvailable){
    ['newProjectBtn','renameProjectBtn','deleteProjectBtn','logoutBtn','projectSelect'].forEach(id=>{
      const el = document.getElementById(id); if(el) el.style.display = 'none';
    });
  }
  // scena 3D se inițializează ABIA ACUM, când #app e vizibil — altfel ecranul are dimensiune 0 (ascuns sub login) și tot ce ține de 3D iese stricat
  initThree();
  resizeThree();
  setTimeout(resizeThree, 60);
  sidebar.addEventListener('transitionend', (e)=>{ if(e.propertyName==='width') resizeThree(); });
  startAfterFirebase();
}
function wireLogin(){
  const emailEl = document.getElementById('loginEmail');
  const passEl = document.getElementById('loginPass');
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  const doLogin = ()=>{
    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Se verifică...';
    window.fb.signInWithEmailAndPassword(window.fb.auth, emailEl.value.trim(), passEl.value)
      .catch(err=>{
        errEl.textContent = 'Email sau parolă greșită.';
        btn.disabled = false; btn.textContent = 'Intră';
      });
  };
  btn.addEventListener('click', doLogin);
  passEl.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    window.fb.signOut(window.fb.auth);
    window.__appStarted = false; // fără asta, un login ulterior nu mai pornea aplicația la loc
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginOverlay').style.display = 'flex';
    emailEl.value=''; passEl.value=''; errEl.textContent='';
  });
}
function startAuthFlow(){
  wireLogin();
  window.fb.onAuthStateChanged(window.fb.auth, (user)=>{
    if(user) showApp();
  });
}
if(window.fb){ startAuthFlow(); }
else {
  window.addEventListener('firebase-ready', startAuthFlow, {once:true});
  // dacă Firebase nu apucă să răspundă repede (ex. testare aici, în chat, unde modulele externe
  // pot fi blocate) — trecem direct în modul local, fără login, ca să nu rămână blocat ecranul
  setTimeout(()=>{
    if(!window.__appStarted && !window.fb){
      firebaseAvailable = false;
      showApp();
    }
  }, 3000);
}

})();
</script>
